name: Deploy league history to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test league history
        run: node --test src/fe/*.test.mjs
      - name: Test offline exporters
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Stage static site
        run: |
          mkdir -p _site/src/fe
          cp index.html _site/
          cp src/fe/app.mjs src/fe/history.mjs src/fe/analytics.mjs src/fe/features.mjs src/fe/ui.mjs src/fe/styles.css _site/src/fe/
          cp -R data _site/data
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
